name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 376726737739.dkr.ecr.eu-north-1.amazonaws.com

jobs:
  build-scan-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [vote, result, worker]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/voting-app/${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/voting-app/${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Image to AWS ECR
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/voting-app/${{ matrix.service }}:${{ github.sha }}
          docker tag ${{ env.ECR_REGISTRY }}/voting-app/${{ matrix.service }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/voting-app/${{ matrix.service }}:latest
          docker push ${{ env.ECR_REGISTRY }}/voting-app/${{ matrix.service }}:latest
